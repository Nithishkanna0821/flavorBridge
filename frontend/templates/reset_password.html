{% extends "base.html" %}

{% block title %}Set New Password — FlavorBridge{% endblock %}

{% block content %}
<div class="container container-narrow" style="padding: 3.5rem 1.25rem;">
  <div class="form-card" style="box-shadow: var(--shadow-md); border-radius: 18px; padding: 2.5rem 2rem;">
    
    <div style="text-align: center; margin-bottom: 2rem;">
      <div style="width: 64px; height: 64px; border-radius: 50%; background: #E8F8F5; color: #27AE60; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; margin: 0 auto 1rem; border: 2px solid #A3E4D7;">
        <i class="fa-solid fa-lock-open"></i>
      </div>
      <h1 style="font-size: 2rem; margin-bottom: 0.35rem;">Set New Password</h1>
      <p style="color: var(--gray-dark); font-size: 0.95rem;">
        Resetting password for <strong>{{ user.name }}</strong> ({{ user.email }})
      </p>
    </div>

    <form method="POST" action="{{ url_for('auth.reset_password') }}" data-validate="true">
      
      <div class="form-group">
        <label class="form-label" for="new-password">New Password (min 6 characters) *</label>
        <input type="password" id="new-password" name="password" class="form-control form-control-lg" placeholder="••••••••" required minlength="6" autofocus>
      </div>

      <div class="form-group">
        <label class="form-label" for="confirm-password">Confirm New Password *</label>
        <input type="password" id="confirm-password" name="confirm_password" class="form-control form-control-lg" placeholder="••••••••" required minlength="6">
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg" id="reset-submit-btn" style="margin-top: 1.5rem;">
        <i class="fa-solid fa-shield-check"></i> Update Password & Sign In
      </button>
    </form>

    <div style="text-align: center; margin-top: 2rem; font-size: 0.9rem; color: var(--gray-dark); border-top: 1px solid var(--gray-light); padding-top: 1.25rem;">
      Cancel reset? <a href="{{ url_for('auth.login', role=user.role) }}" style="font-weight: 700; color: var(--primary);">Back to Log In</a>
    </div>

  </div>
</div>
{% endblock %}
