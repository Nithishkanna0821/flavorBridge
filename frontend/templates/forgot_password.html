{% extends "base.html" %}

{% block title %}Forgot Password — FlavorBridge{% endblock %}

{% block content %}
<div class="container container-narrow" style="padding: 3.5rem 1.25rem;">
  <div class="form-card" style="box-shadow: var(--shadow-md); border-radius: 18px; padding: 2.5rem 2rem;">
    
    <div style="text-align: center; margin-bottom: 2rem;">
      <div style="width: 64px; height: 64px; border-radius: 50%; background: #FAF7F2; color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 1.8rem; margin: 0 auto 1rem; border: 2px solid #ECE7DE;">
        <i class="fa-solid fa-key"></i>
      </div>
      <h1 style="font-size: 2rem; margin-bottom: 0.35rem;">Reset Your Password</h1>
      <p style="color: var(--gray-dark); font-size: 0.95rem;">Enter your registered email address and we'll help you securely reset your password</p>
    </div>

    <form method="POST" action="{{ url_for('auth.forgot_password') }}" data-validate="true">
      <input type="hidden" name="role" value="{{ role }}">

      <div class="form-group">
        <label class="form-label" for="reset-email">Registered Email Address *</label>
        <input type="email" id="reset-email" name="email" class="form-control form-control-lg" placeholder="e.g. ananya@example.com or priya@example.com" required autofocus>
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg" id="forgot-submit-btn" style="margin-top: 1.5rem;">
        <i class="fa-solid fa-arrow-right"></i> Verify Account & Proceed
      </button>
    </form>

    <div style="text-align: center; margin-top: 2rem; font-size: 0.9rem; color: var(--gray-dark); border-top: 1px solid var(--gray-light); padding-top: 1.25rem;">
      Remember your password? <a href="{{ url_for('auth.login', role=role) }}" style="font-weight: 700; color: var(--primary);">Back to Log In</a>
    </div>

  </div>
</div>
{% endblock %}
